<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>地学 テストトレ｜太陽系・銀河系・恒星</title>
<style>
  :root{
    --bg:#f7f4ec; --panel:#ffffff; --ink:#2b2b33; --sub:#6b6b78;
    --accent:#3b6ea5; --accent2:#c9a24b; --line:#e6e0d4; --good:#2f8f6b;
    --ans-bg:#f0f6fb; --ans-line:#cfe0f0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:720px; margin:0 auto; padding:10px 12px calc(12px + env(safe-area-inset-bottom));}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 2px 10px;}
  header h1{font-size:16px; margin:0; letter-spacing:.02em;}
  header .rng{font-size:11px; color:var(--sub);}
  .progress{font-size:12px; color:var(--sub); background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px; white-space:nowrap;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px 12px; box-shadow:0 1px 3px rgba(0,0,0,.04); margin-bottom:12px;}
  .qhead{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .badge{font-size:11px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px;}
  .badge.calc{background:var(--accent2);}
  .badge.fill{background:#5a8a6b;}
  .badge.choice{background:#7a6aa5;}
  .badge.zu{background:#b5744b;}
  .topic{font-size:11px; color:var(--sub);}
  .qtext{font-size:16px; line-height:1.7; margin:2px 0 4px;}
  .qtext .em{color:var(--accent); font-weight:700;}
  .qtext .box{display:inline-block; min-width:1.8em; border:1px solid #333; border-radius:4px; padding:0 4px; text-align:center; font-weight:700;}
  .qtext .ch{display:block; margin:2px 0 2px 1em; font-size:15px;}
  .qtext svg{max-width:100%; height:auto; background:#fff; border:1px solid #eee; border-radius:8px; margin:8px auto; display:block;}
  .qtext figcaption{font-size:11px; color:var(--sub); text-align:center; margin-top:-2px;}
  .hint{font-size:12px; color:var(--sub); margin-top:6px;}

  .tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 6px;}
  .tools button{font-size:13px; border:1px solid var(--line); background:#fbf9f4; color:var(--ink);
    border-radius:10px; padding:8px 12px; min-height:40px; touch-action:manipulation;}
  .tools button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tools .spacer{flex:1;}
  .tools .sub{font-size:11px; color:var(--sub);}

  .canvaswrap{position:relative; border:1px dashed #d9d2c2; border-radius:12px; background:
    repeating-linear-gradient(#fff, #fff 37px, #f2ede2 38px); overflow:hidden;}
  canvas{display:block; width:100%; height:300px; touch-action:none;}
  .canvaslabel{position:absolute; top:6px; left:10px; font-size:11px; color:#b9b2a2; pointer-events:none;}

  .answerbtn{width:100%; margin-top:10px; font-size:15px; font-weight:700; color:#fff;
    background:var(--good); border:none; border-radius:12px; padding:13px; min-height:48px;}
  .answerbtn.hide{background:#8a8a95;}

  .answer{margin-top:10px; background:var(--ans-bg); border:1px solid var(--ans-line);
    border-radius:12px; padding:12px 13px; font-size:14.5px; line-height:1.75;}
  .answer h3{margin:0 0 6px; font-size:13px; color:var(--accent);}
  .answer .work{background:#fff; border:1px solid var(--ans-line); border-radius:8px;
    padding:8px 10px; margin:8px 0; font-size:14px; line-height:1.7;}
  .answer .key{color:var(--good); font-weight:700;}
  .answer ul{margin:6px 0 0; padding-left:1.1em;}
  .answer.hidden{display:none;}

  .nav{display:flex; align-items:center; gap:10px; margin-top:4px;}
  .nav button{flex:1; font-size:15px; font-weight:700; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:12px; padding:13px; min-height:48px;}
  .nav button:disabled{opacity:.4;}
  .dots{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 2px 0;}
  .dot{width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
    font-size:12px; color:var(--sub); display:flex; align-items:center; justify-content:center;}
  .dot.cur{background:var(--accent); color:#fff; border-color:var(--accent);}
  .dot.done{border-color:var(--good); color:var(--good);}
  .dot.mastered{background:var(--good); color:#fff; border-color:var(--good);}
  .dot.weak{background:#fff4e6; border-color:#e0a04b; color:#b56d18;}
  footer{text-align:center; color:var(--sub); font-size:11px; margin-top:14px;}
  footer a{color:var(--sub); text-decoration:underline;}

  /* モード切替 */
  .modebar{display:flex; gap:6px; margin:0 2px 10px;}
  .modebar button{flex:1; font-size:12.5px; font-weight:700; border:1px solid var(--line);
    background:var(--panel); color:var(--sub); border-radius:10px; padding:9px 6px; min-height:40px;}
  .modebar button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .modebar button .cnt{font-size:11px; opacity:.85;}

  /* 自己採点 */
  .grade{display:none; gap:10px; margin-top:10px;}
  .grade.show{display:flex;}
  .grade button{flex:1; font-size:15px; font-weight:700; border:none; border-radius:12px; padding:13px; min-height:52px; color:#fff;}
  .grade .ok{background:var(--good);}
  .grade .ng{background:#d1685e;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#2b2b33; color:#fff; font-size:13px; padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; max-width:90%;}
  .toast.show{opacity:.95; transform:translateX(-50%) translateY(0);}

  .empty{text-align:center; padding:30px 14px; color:var(--sub); font-size:14px; line-height:1.8;}
  .empty .big{font-size:34px; display:block; margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>地学 テストトレ ✍️</h1>
      <div class="rng">太陽系・銀河系・恒星（穴埋め・記号・計算・図）</div>
    </div>
    <div class="progress" id="progress">1 / 15</div>
  </header>

  <div class="modebar">
    <button id="modeAll" class="active">全問（順番に）</button>
    <button id="modeReview">苦手だけ復習 <span class="cnt" id="weakCnt">0</span></button>
  </div>

  <div class="card" id="card">
    <div class="qhead">
      <span class="badge" id="badge">記述</span>
      <span class="topic" id="topic">太陽系</span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="hint" id="hint"></div>

    <div class="tools">
      <button id="penBtn" class="active">✏️ ペン</button>
      <button id="eraserBtn">◻︎ 消しゴム</button>
      <button id="clearBtn">🗑 全消し</button>
      <span class="spacer"></span>
      <span class="sub">指で書けます</span>
    </div>

    <div class="canvaswrap">
      <canvas id="pad"></canvas>
      <span class="canvaslabel">ここに答えを書く</span>
    </div>

    <button class="answerbtn" id="answerBtn">答えを見る 👀</button>
    <div class="answer hidden" id="answer"></div>

    <div class="grade" id="grade">
      <button class="ng" id="ngBtn">✕ もう一度</button>
      <button class="ok" id="okBtn">◯ 覚えてた</button>
    </div>
  </div>

  <div class="empty" id="empty" style="display:none;"></div>

  <div class="nav" id="nav">
    <button id="prevBtn">◀ 前へ</button>
    <button id="nextBtn">次へ ▶</button>
  </div>
  <div class="dots" id="dots"></div>

  <footer>
    グレイス・イングリッシュ・ラボ ｜ 楓ちゃんの地学対策<br>
    <a href="#" id="resetLink">学習の記録をリセット</a>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 問題データ（地学・発展：太陽系／恒星／銀河系） ===== */
const QUESTIONS = [
  /* ===== 太陽系 ===== */
  {
    topic:"太陽系", type:"穴埋め",
    q:`次の空欄 <span class="box">ア</span>〜<span class="box">エ</span> に入る語を答えよ。<br>太陽の中心部では、4個の <span class="box">ア</span> 原子核が1個の <span class="box">イ</span> 原子核に変わる <span class="box">ウ</span> 反応が起こり、このとき失われるわずかな <span class="box">エ</span> がエネルギーに変わる。`,
    hint:"太陽の中心で起きている反応",
    a:`<div class="work">ア＝<span class="key">水素</span>／イ＝<span class="key">ヘリウム</span>／ウ＝<span class="key">核融合</span>（水素の核融合）／エ＝<span class="key">質量</span></div>
    <p>中心部は約1600万K。E＝mc² により、減った質量がエネルギーになる。</p>`
  },
  {
    topic:"太陽", type:"穴埋め",
    q:`空欄 <span class="box">ア</span>〜<span class="box">オ</span> に入る語・数値を答えよ。<br>太陽の目に見える表面を <span class="box">ア</span> といい、温度は約 <span class="box">イ</span> K。その外側に広がる希薄で非常に高温のガスの層を <span class="box">ウ</span> といい、温度は約 <span class="box">エ</span> K以上。表面に見える黒い斑点を <span class="box">オ</span> という。`,
    hint:"光球・コロナ・黒点と温度",
    a:`<div class="work">ア＝<span class="key">光球</span>／イ＝<span class="key">6000</span>／ウ＝<span class="key">コロナ</span>／エ＝<span class="key">100万</span>／オ＝<span class="key">黒点</span></div>
    <p>光球6000K → 外側のコロナは100万K以上と逆に高温。皆既日食で彩層・コロナが見える。</p>`
  },
  {
    topic:"太陽", type:"選択",
    q:`黒点が周囲より黒く見える理由として正しいものを、ア〜ウから選び記号で答えよ。<br>
    <span class="ch">ア　まわりより温度が高いから</span>
    <span class="ch">イ　まわりより温度が低いから</span>
    <span class="ch">ウ　光をさえぎる雲があるから</span>`,
    hint:"黒い＝温度が…？",
    a:`<div class="work"><span class="key">イ</span></div>
    <p>黒点は約4000Kで、まわりの光球（約6000K）より低温なので暗く見える。黒点の数は約<span class="key">11年</span>周期で増減する。</p>`
  },
  {
    topic:"太陽系", type:"選択",
    q:`木星型惑星の組み合わせとして正しいものを、ア〜ウから選び記号で答えよ。<br>
    <span class="ch">ア　水星・金星・地球・火星</span>
    <span class="ch">イ　木星・土星・天王星・海王星</span>
    <span class="ch">ウ　地球・火星・木星・土星</span>`,
    hint:"太陽系の外側の4つ",
    a:`<div class="work"><span class="key">イ</span></div>
    <p>木星型＝木・土・天・海（大きく密度小・ガス）。地球型＝水・金・地・火（小さく密度大・岩石）。</p>`
  },
  {
    topic:"太陽系", type:"穴埋め",
    q:`空欄 <span class="box">ア</span> <span class="box">イ</span> に「大き」か「小さ」を入れよ。<br>地球型惑星は半径が <span class="box">ア</span> く密度が大きい。木星型惑星は半径が <span class="box">イ</span> く密度が小さい。`,
    hint:"地球型と木星型、どちらが大きい？",
    a:`<div class="work">ア＝<span class="key">小さ</span>／イ＝<span class="key">大き</span></div>
    <p>地球型＝岩石・金属でできた小さく重い惑星。木星型＝ガス中心で大きく軽い惑星。</p>`
  },
  {
    topic:"太陽系", type:"計算",
    q:`軌道長半径が 9 AU の惑星の公転周期は何年か。<br>〔ケプラーの第3法則：T² ＝ a³（T は年、a は天文単位）〕`,
    hint:"T² ＝ a³ に a＝9 を代入",
    a:`<div class="work">T² ＝ a³ ＝ 9³ ＝ 729<br>T ＝ √729 ＝ <span class="key">27 年</span></div>
    <p>軌道が大きい惑星ほど公転周期は長い。a³ と T² が等しい。</p>`
  },
  {
    topic:"太陽", type:"穴埋め",
    q:`空欄に数値（およそ）を入れよ。<br>太陽の中心部の温度は約 <span class="box">ア</span> K、表面（光球）の温度は約 <span class="box">イ</span> K である。`,
    hint:"中心はけた違いに高温",
    a:`<div class="work">ア＝<span class="key">1600万</span>（1.6×10⁷）／イ＝<span class="key">6000</span></div>`
  },
  {
    topic:"太陽系", type:"穴埋め",
    q:`地球型惑星と木星型惑星は、主に何でできているか。空欄 <span class="box">ア</span> <span class="box">イ</span> に入る語を答えよ。<br>地球型＝おもに <span class="box">ア</span> と金属／木星型＝おもに水素・ヘリウムなどの <span class="box">イ</span> `,
    hint:"かたい？ガス？",
    a:`<div class="work">ア＝<span class="key">岩石</span>／イ＝<span class="key">ガス</span>（気体）</div>
    <p>木星型は外側ほど氷成分も多い（天王星・海王星）。</p>`
  },

  /* ===== 恒星 ===== */
  {
    topic:"恒星", type:"穴埋め",
    q:`空欄 <span class="box">ア</span>〜<span class="box">エ</span> に入る語・数値を答えよ。<br>目で見たままの明るさを表す等級を <span class="box">ア</span> 等級といい、値が小さいほど明るい。すべての星を <span class="box">イ</span> パーセクの距離に置いたと仮定した明るさを <span class="box">ウ</span> 等級という。等級が5小さくなると明るさは <span class="box">エ</span> 倍になる。`,
    hint:"見かけ／絶対、10pc、5等級",
    a:`<div class="work">ア＝<span class="key">見かけの</span>／イ＝<span class="key">10</span>／ウ＝<span class="key">絶対</span>／エ＝<span class="key">100</span></div>`
  },
  {
    topic:"恒星", type:"計算",
    q:`1等星は6等星のおよそ何倍明るいか。また、1等級ちがうと明るさは約何倍になるか。`,
    hint:"5等級差＝100倍",
    a:`<div class="work">6等 − 1等 ＝ 5等級の差 → <span class="key">100倍</span><br>1等級あたり ＝ 100の5乗根 ≒ <span class="key">約2.5倍</span></div>`
  },
  {
    topic:"恒星", type:"計算",
    q:`ある恒星の年周視差は 0.05″（秒）であった。この恒星までの距離は何パーセクか。また約何光年か（1pc ＝ 3.26光年）。`,
    hint:"距離[pc] ＝ 1 ÷ 年周視差[″]",
    a:`<div class="work">d ＝ 1 ÷ 0.05 ＝ <span class="key">20 pc</span><br>20 × 3.26 ＝ <span class="key">約65 光年</span></div>
    <p>年周視差が小さいほど遠い。</p>`
  },
  {
    topic:"恒星", type:"計算",
    q:`見かけの等級が ＋7.0、絶対等級が ＋2.0 の恒星までの距離は何パーセクか。<br>〔m − M ＝ 5 log(d / 10)〕`,
    hint:"まず m−M を求めて代入",
    a:`<div class="work">m − M ＝ 7.0 − 2.0 ＝ 5<br>5 ＝ 5 log(d/10) → log(d/10) ＝ 1<br>d/10 ＝ 10 → d ＝ <span class="key">100 pc</span></div>`
  },
  {
    topic:"恒星", type:"選択",
    q:`恒星の見かけの明るさと、その恒星までの距離の関係として正しいものを、ア〜エから選び記号で答えよ。<br>
    <span class="ch">ア　距離に比例する</span>
    <span class="ch">イ　距離の2乗に比例する</span>
    <span class="ch">ウ　距離に反比例する</span>
    <span class="ch">エ　距離の2乗に反比例する</span>`,
    hint:"2倍遠いと明るさは？",
    a:`<div class="work"><span class="key">エ</span>（距離の2乗に反比例）</div>
    <p>2倍遠いと明るさは1/4。これを逆2乗の法則という。</p>`
  },
  {
    topic:"恒星", type:"選択",
    q:`恒星のスペクトル型を、表面温度の高いものから順に並べたものを、ア〜ウから選び記号で答えよ。<br>
    <span class="ch">ア　M K G F A B O</span>
    <span class="ch">イ　O B A F G K M</span>
    <span class="ch">ウ　O A B F G K M</span>`,
    hint:"O型が高温・青白",
    a:`<div class="work"><span class="key">イ</span>（O B A F G K M）</div>
    <p>左が高温（青白）、右が低温（赤）。「オー・ベー・ア・フ・グ・ケ・ム」。</p>`
  },
  {
    topic:"恒星", type:"選択",
    q:`太陽のスペクトル型と色の組み合わせとして正しいものを、ア〜ウから選び記号で答えよ。<br>
    <span class="ch">ア　O型・青白色</span>
    <span class="ch">イ　G型・黄色</span>
    <span class="ch">ウ　M型・赤色</span>`,
    hint:"太陽は黄色い星",
    a:`<div class="work"><span class="key">イ</span>（G型・黄色）</div>
    <p>太陽の表面温度は約6000K。</p>`
  },
  {
    topic:"恒星", type:"穴埋め",
    q:`空欄に色を入れよ。<br>表面温度が最も高い恒星は <span class="box">ア</span> 色、最も低い恒星は <span class="box">イ</span> 色に見える。`,
    hint:"高温ほど青、低温ほど…",
    a:`<div class="work">ア＝<span class="key">青</span>（青白）／イ＝<span class="key">赤</span></div>`
  },
  {
    topic:"恒星", type:"図",
    q:`下の図はHR図である。縦軸 <span class="box">オ</span> ・横軸 <span class="box">カ</span> に入る語を答え、a〜d の名称を ①主系列星 ②赤色巨星 ③白色矮星 から選び番号で答えよ。
    <figure>
      <svg width="270" height="210" viewBox="0 0 270 210" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="10" width="200" height="160" fill="none" stroke="#000"/>
        <text x="12" y="20" font-size="9">明</text>
        <text x="12" y="165" font-size="9">暗</text>
        <text x="46" y="186" font-size="8">O</text><text x="76" y="186" font-size="8">B</text>
        <text x="106" y="186" font-size="8">A</text><text x="133" y="186" font-size="8">F</text>
        <text x="160" y="186" font-size="8">G</text><text x="190" y="186" font-size="8">K</text>
        <text x="218" y="186" font-size="8">M</text>
        <text x="66" y="202" font-size="8.5">← 高温　　表面温度　　低温 →</text>
        <text x="20" y="95" font-size="8.5" transform="rotate(-90 20 95)">絶対等級</text>
        <line x1="55" y1="28" x2="225" y2="150" stroke="#000" stroke-width="0.7" stroke-dasharray="2,2"/>
        <text x="60" y="40" font-size="9" font-weight="bold">a</text>
        <circle cx="90" cy="58" r="1.6"/><circle cx="120" cy="78" r="1.6"/><circle cx="150" cy="98" r="1.6"/>
        <circle cx="180" cy="118" r="1.6"/><circle cx="205" cy="138" r="1.6"/>
        <text x="163" y="94" font-size="9" font-weight="bold">b</text>

    a:`<div class="work">d ＝ 1 ÷ 0.10 ＝ <span class="key">10 pc</span><br>10 × 3.26 ＝ <span class="key">約32.6 光年</span></div>`

  /* ② 何倍明るいか（等級） */

    hint:"d/10 ＝ 100、log100 ＝ 2",
    a:`<div class="work">M ＝ 8.0 − 5 log(1000/10) ＝ 8.0 − 5 log100<br>＝ 8.0 − 5 × 2 ＝ <span class="key">−2.0</span></div>`
  },
  {
    topic:"恒星", type:"計算",

  },
  {
    topic:"恒星", type:"計算",
    q:`ある恒星が最も強く放つ光の波長は 725 nm（7.25×10⁻⁷ m）であった。表面温度は約何Kか。<br>〔T ＝ 2.9×10⁻³ / λmax〕`,
    hint:"波長が長い＝低温（赤い星）",
    a:`<div class="work">T ＝ 2.9×10⁻³ ÷ 7.25×10⁻⁷ ＝ <span class="key">約4000 K</span></div>
    <p>太陽より波長が長い→温度が低い→赤っぽく見える。</p>`

  /* ⑤ HR図を見て距離を求める */
  {
    topic:"恒星", type:"図",
    q:`下のHR図で、●の恒星は主系列星で、絶対等級は ＋5.0 と読み取れる。この恒星の見かけの等級が ＋10.0 のとき、距離は何パーセクか。<br>〔m − M ＝ 5 log(d / 10)〕
    <figure>

        <text x="106" y="186" font-size="8">A</text><text x="133" y="186" font-size="8">F</text>
        <text x="160" y="186" font-size="8">G</text><text x="190" y="186" font-size="8">K</text>
        <text x="218" y="186" font-size="8">M</text>
        <text x="66" y="202" font-size="8.5">← 高温　　表面温度　　低温 →</text>
        <text x="20" y="95" font-size="8.5" transform="rotate(-90 20 95)">絶対等級</text>
        <line x1="55" y1="28" x2="225" y2="150" stroke="#000" stroke-width="0.7" stroke-dasharray="2,2"/>
        <circle cx="150" cy="98" r="3.4" fill="#c0392b"/>
        <text x="156" y="96" font-size="9" font-weight="bold" fill="#c0392b">●</text>
      </svg>
      <figcaption>HR図（●の星の絶対等級＝＋5.0）</figcaption>
    </figure>`,
    hint:"m−M を出して式に代入",
    a:`<div class="work">m − M ＝ 10.0 − 5.0 ＝ 5<br>5 ＝ 5 log(d/10) → log(d/10) ＝ 1<br>d/10 ＝ 10 → d ＝ <span class="key">100 pc</span></div>
    <p>HR図で主系列星の位置から絶対等級を読み、見かけの等級と合わせて距離を出す。</p>`
  },
  {
    topic:"恒星", type:"計算",
    q:`HR図から、ある恒星の絶対等級は 0.0 と読み取れた。この恒星の見かけの等級が ＋10.0 のとき、距離は何パーセクか。<br>〔m − M ＝ 5 log(d / 10)〕`,
    hint:"m−M ＝ 10",
    a:`<div class="work">m − M ＝ 10.0 − 0.0 ＝ 10<br>10 ＝ 5 log(d/10) → log(d/10) ＝ 2<br>d/10 ＝ 100 → d ＝ <span class="key">1000 pc</span></div>`
  },

  /* ⑥ 半径が太陽の何倍か（シュテファン・ボルツマン） */
  {
    topic:"恒星", type:"計算",
    q:`ある恒星は、光度が太陽の 100倍、表面温度は太陽と同じである。この恒星の半径は太陽の何倍か。<br>〔L/L☉ ＝ (R/R☉)² × (T/T☉)⁴〕`,
    hint:"温度が同じなら L∝R²。R/R☉＝√(L/L☉)",
    a:`<div class="work">100 ＝ (R/R☉)² × 1⁴<br>(R/R☉)² ＝ 100 → R/R☉ ＝ <span class="key">10倍</span></div>`
  },
  {
    topic:"恒星", type:"計算",
    q:`ある恒星は、光度が太陽の 10000倍、表面温度が太陽の 2倍である。半径は太陽の何倍か。<br>〔L/L☉ ＝ (R/R☉)² × (T/T☉)⁴〕`,
    hint:"(R/R☉)² ＝ (L/L☉) ÷ (T/T☉)⁴",
    a:`<div class="work">(R/R☉)² ＝ 10000 ÷ 2⁴ ＝ 10000 ÷ 16 ＝ 625<br>R/R☉ ＝ √625 ＝ <span class="key">25倍</span></div>`
  },
  {
    topic:"恒星", type:"計算",
    q:`ある赤色巨星は、光度が太陽の 10000倍、表面温度が太陽の 0.5倍である。半径は太陽の何倍か。<br>〔L/L☉ ＝ (R/R☉)² × (T/T☉)⁴〕`,
    hint:"温度が低いのに明るい→とても大きい",
    a:`<div class="work">(R/R☉)² ＝ 10000 ÷ (0.5)⁴ ＝ 10000 ÷ 0.0625 ＝ 160000<br>R/R☉ ＝ √160000 ＝ <span class="key">400倍</span></div>
    <p>赤色巨星は低温でも半径が非常に大きいので明るい。</p>`
  },

  /* ⑦ 恒星の寿命を求める */
  {
    topic:"恒星", type:"計算",
    q:`質量が太陽の 10倍、光度が太陽の 10000倍の恒星がある。この恒星の寿命は太陽の何倍か。太陽の寿命を約100億年とすると、約何年か。<br>〔寿命 ∝ 質量 / 光度（燃料÷使う速さ）〕`,
    hint:"寿命の比 ＝ (M/M☉) ÷ (L/L☉)",
    a:`<div class="work">寿命の比 ＝ 10 ÷ 10000 ＝ 1/1000<br>100億年 × 1/1000 ＝ <span class="key">1000万年</span></div>
    <p>重い星は明るいぶん燃料を速く使い、寿命は短い。</p>`
  },
  {
    topic:"恒星", type:"計算",
    q:`質量が太陽の 2倍、光度が太陽の 16倍の恒星の寿命は、太陽の何倍か。太陽の寿命を100億年として、約何年か。<br>〔寿命 ∝ 質量 / 光度〕`,
    hint:"2 ÷ 16",
    a:`<div class="work">寿命の比 ＝ 2 ÷ 16 ＝ 1/8<br>100億年 × 1/8 ＝ <span class="key">約12.5億年</span></div>`
  }
];

/* ===== 状態 ===== */
const N = QUESTIONS.length;
let idx = 0;            // 全問モードの現在位置(0..N-1)
let cur = 0;           // 現在表示している実問題index
let mode = "pen";      // pen | eraser
let viewMode = "all";  // all | review
const savedDrawings = new Array(N).fill(null);

/* ===== 学習記録（iPhoneに保存 / Leitron風の箱で間隔反復） ===== */
const STORE_KEY = "chigaku_stats_v1";
const MASTER = 2;      // 連続◯がこの数に達したら「習得」
let stats;             // [{box, correct, wrong, seen}]
function loadStats(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  if(!Array.isArray(s) || s.length !== N){
    s = []; for(let i=0;i<N;i++) s.push({box:0,correct:0,wrong:0,seen:false});
  }
  stats = s;
}
function saveStats(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){} }
function isMastered(i){ return stats[i].box >= MASTER; }
function isWeak(i){ return stats[i].seen && !isMastered(i); }
function weakList(){ const a=[]; for(let i=0;i<N;i++) if(isWeak(i)) a.push(i); return a; }
function applyGrade(i, correct){
  stats[i].seen = true;
  if(correct){ stats[i].correct++; stats[i].box++; }
  else { stats[i].wrong++; stats[i].box = 0; }
  saveStats();
}

/* 復習キュー（間隔反復：先頭が次に出る問題） */
let queue = [];
function buildReviewQueue(){
  queue = weakList().sort((a,b)=> stats[a].box - stats[b].box);
}

/* ===== DOM ===== */
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
const badge = document.getElementById('badge');
const topicEl = document.getElementById('topic');
const qtextEl = document.getElementById('qtext');
const hintEl = document.getElementById('hint');
const answerEl = document.getElementById('answer');
const answerBtn = document.getElementById('answerBtn');
const progressEl = document.getElementById('progress');
const dotsEl = document.getElementById('dots');

/* ===== キャンバス設定 ===== */
let dpr = Math.max(1, window.devicePixelRatio || 1);
function setupCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function applyPenStyle(){
  if(mode === 'eraser'){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 22 * dpr;
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = 3.2 * dpr;
    ctx.strokeStyle = '#1f3a5f';
  }
}

/* 描画 */
let drawing = false, lastX = 0, lastY = 0;
function posFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * dpr;
  const cy = (e.clientY - rect.top) * dpr;
  return [cx, cy];
}
function startDraw(e){
  e.preventDefault();
  drawing = true;
  applyPenStyle();
  [lastX, lastY] = posFromEvent(e);
  // 点だけでも描けるように
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(lastX + 0.01, lastY + 0.01);
  ctx.stroke();
}
function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();
  const [x, y] = posFromEvent(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  lastX = x; lastY = y;
}
function endDraw(e){
  if(!drawing) return;
  drawing = false;
  saveCurrent();
}
canvas.addEventListener('pointerdown', startDraw);
canvas.addEventListener('pointermove', moveDraw);
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);
canvas.addEventListener('pointerleave', endDraw);

/* 保存・復元 */
function saveCurrent(){
  try{ savedDrawings[cur] = canvas.toDataURL(); }catch(e){}
}
function restoreCurrent(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const data = savedDrawings[cur];
  if(data){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = data;
  }
}

/* ===== 出題描画 ===== */
const gradeBox = document.getElementById('grade');
function render(){
  const item = QUESTIONS[cur];
  badge.textContent = item.type;
  const typeCls = {'計算':'calc','穴埋め':'fill','選択':'choice','図':'zu'};
  badge.className = 'badge' + (typeCls[item.type] ? (' '+typeCls[item.type]) : '');
  topicEl.textContent = item.topic;
  qtextEl.innerHTML = `<b>Q${cur+1}.</b> ` + item.q;
  hintEl.textContent = item.hint ? 'ヒント：' + item.hint : '';
  answerEl.innerHTML = '<h3>模範解答・解説</h3>' + item.a;
  answerEl.classList.add('hidden');
  answerBtn.textContent = '答えを見る 👀';
  answerBtn.classList.remove('hide');
  gradeBox.classList.remove('show');
  if(viewMode === 'review'){
    progressEl.textContent = '復習 のこり ' + queue.length + '問';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
  } else {
    progressEl.textContent = (idx+1) + ' / ' + N;
    document.getElementById('prevBtn').disabled = (idx === 0);
    document.getElementById('nextBtn').disabled = (idx === N-1);
  }
  setupCanvas();
  restoreCurrent();
  renderDots();
  updateModeUI();
}
// qテキストの改行を活かす
function escapeKeepTags(s){ return s.replace(/\n/g,'<br>'); }

function renderDots(){
  dotsEl.innerHTML = '';
  for(let i=0;i<N;i++){
    const d = document.createElement('div');
    let cls = 'dot' + (i===cur ? ' cur' : (isMastered(i) ? ' mastered' : (isWeak(i) ? ' weak' : '')));
    d.className = cls;
    d.textContent = (i+1);
    d.addEventListener('click', ()=>{ saveCurrent(); idx=i; cur=i; render(); window.scrollTo({top:0,behavior:'smooth'}); });
    dotsEl.appendChild(d);
  }
}

function updateModeUI(){
  document.getElementById('modeAll').classList.toggle('active', viewMode==='all');
  document.getElementById('modeReview').classList.toggle('active', viewMode==='review');
  document.getElementById('weakCnt').textContent = weakList().length;
  const showNav = (viewMode==='all');
  document.getElementById('nav').style.display = showNav ? '' : 'none';
  dotsEl.style.display = showNav ? '' : 'none';
}

/* ===== モード切替 ===== */
function switchMode(m){
  saveCurrent();
  viewMode = m;
  document.getElementById('card').style.display = '';
  document.getElementById('empty').style.display = 'none';
  if(m === 'review'){
    buildReviewQueue();
    if(queue.length === 0){ showEmptyReview(); return; }
    cur = queue[0];
  } else {
    cur = idx;
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function showEmptyReview(){
  document.getElementById('card').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  dotsEl.style.display = 'none';
  const e = document.getElementById('empty');
  e.style.display = 'block';
  e.innerHTML = '<span class="big">🎉</span>にがてを ぜんぶクリア！<br>よくがんばりました。<br><br>' +
    '<button class="answerbtn" style="background:var(--accent)" id="backAll">全問モードにもどる</button>';
  document.getElementById('backAll').onclick = ()=>switchMode('all');
  updateModeUI();
}

/* ===== 自己採点（間隔反復） ===== */
function grade(correct){
  saveCurrent();
  const i = cur;
  if(viewMode === 'review'){
    queue.shift();               // 先頭を取り出す
    applyGrade(i, correct);
    if(!isMastered(i)){          // 未習得なら間隔をあけて再登録
      const gap = correct ? (stats[i].box>=1 ? 6 : 3) : 2;
      queue.splice(Math.min(gap, queue.length), 0, i);
    }
    toast(correct ? '◯ その調子！' : '✕ もう一度出すね');
    if(queue.length === 0){ showEmptyReview(); return; }
    cur = queue[0];
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    applyGrade(i, correct);
    toast(correct ? '◯ 覚えてた！' : '✕ 苦手に登録');
    if(idx < N-1){ idx++; cur = idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    else {
      render();
      const w = weakList().length;
      toast(w>0 ? ('全問おわり！「苦手だけ復習」で仕上げよう（'+w+'問）') : '全問クリア！すばらしい🎉');
    }
  }
}

/* ===== ボタン ===== */
document.getElementById('penBtn').addEventListener('click', ()=>{
  mode='pen';
  document.getElementById('penBtn').classList.add('active');
  document.getElementById('eraserBtn').classList.remove('active');
});
document.getElementById('eraserBtn').addEventListener('click', ()=>{
  mode='eraser';
  document.getElementById('eraserBtn').classList.add('active');
  document.getElementById('penBtn').classList.remove('active');
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  savedDrawings[cur] = null;
});
answerBtn.addEventListener('click', ()=>{
  const hidden = answerEl.classList.contains('hidden');
  if(hidden){
    answerEl.classList.remove('hidden');
    answerBtn.textContent = '答えを隠す';
    answerBtn.classList.add('hide');
    gradeBox.classList.add('show');   // 採点ボタンを出す
  } else {
    answerEl.classList.add('hidden');
    answerBtn.textContent = '答えを見る 👀';
    answerBtn.classList.remove('hide');
    gradeBox.classList.remove('show');
  }
});
document.getElementById('okBtn').addEventListener('click', ()=>grade(true));
document.getElementById('ngBtn').addEventListener('click', ()=>grade(false));
document.getElementById('modeAll').addEventListener('click', ()=>switchMode('all'));
document.getElementById('modeReview').addEventListener('click', ()=>switchMode('review'));
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(viewMode==='all' && idx>0){ saveCurrent(); idx--; cur=idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(viewMode==='all' && idx<N-1){ saveCurrent(); idx++; cur=idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.getElementById('resetLink').addEventListener('click', (e)=>{
  e.preventDefault();
  if(confirm('学習の記録（◯✕・にがて）をぜんぶ消してリセットします。よろしいですか？')){
    for(let i=0;i<N;i++) stats[i] = {box:0,correct:0,wrong:0,seen:false};
    saveStats();
    idx=0; switchMode('all');
    toast('記録をリセットしました');
  }
});

/* トースト */
let toastTimer=null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1500);
}

/* リサイズ（回転など）時：内容を退避してキャンバス再構築 */
let resizeTimer=null;
window.addEventListener('resize', ()=>{
  saveCurrent();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ dpr = Math.max(1, window.devicePixelRatio||1); render(); }, 150);
});

/* 初期化 */
loadStats();
idx = 0; cur = 0;
render();
</script>
