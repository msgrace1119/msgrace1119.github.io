<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>書いて覚える単語帳 QRコード</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:#f7f4ec; color:#2b2b33; display:flex; justify-content:center; padding:24px 16px;}
  .card{background:#fff; border:1px solid #e6e0d4; border-radius:20px; max-width:440px; width:100%;
    padding:26px 24px 30px; box-shadow:0 2px 10px rgba(0,0,0,.05); text-align:center;}
  h1{font-size:19px; letter-spacing:.02em; margin-bottom:2px;}
  .sub{font-size:12px; color:#6b6b78; margin-bottom:18px;}
  .qrwrap{background:#fff; border:1px solid #eee; border-radius:16px; padding:14px; display:inline-block; margin:0 auto 16px;}
  .qrwrap svg{width:260px; height:260px; display:block;}
  .steps{text-align:left; font-size:14px; line-height:1.9; background:#f0f6fb; border:1px solid #cfe0f0;
    border-radius:12px; padding:14px 16px; margin-bottom:16px;}
  .steps b{color:#3b6ea5;}
  .url{font-size:13px; color:#3b6ea5; word-break:break-all; background:#f7f4ec; border-radius:8px; padding:8px 10px;}
  .url a{color:#3b6ea5;}
  .foot{font-size:11px; color:#9a9488; margin-top:14px; line-height:1.7;}
  @media print{ body{background:#fff;} .card{border:none; box-shadow:none;} }
</style>
</head>

    <div class="steps">
      <b>使い方（楓ちゃんへ）</b><br>
      ① スマホの<b>カメラ</b>を、この四角い模様に向ける<br>
      ② 画面に出るリンクを<b>タップ</b><br>
      ③ 開いたら、共有ボタン → <b>「ホーム画面に追加」</b>でアプリみたいに使える<br>
      ④ 日本語を見て、<b>指でつづりを書いてから</b>「答えを見る」
    </div>

    <div class="url"><a href="https://graceenglishlab.com/tango/">https://graceenglishlab.com/tango/</a></div>
